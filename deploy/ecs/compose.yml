services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${BEIYU_COMPOSE_POSTGRES_DB:?set BEIYU_COMPOSE_POSTGRES_DB}
      POSTGRES_USER: ${BEIYU_COMPOSE_POSTGRES_USER:?set BEIYU_COMPOSE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${BEIYU_COMPOSE_POSTGRES_PASSWORD:?set BEIYU_COMPOSE_POSTGRES_PASSWORD}
    volumes:
      - beiyu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BEIYU_ENVIRONMENT: ${BEIYU_ENVIRONMENT:?set BEIYU_ENVIRONMENT}
      BEIYU_DATABASE_URL: ${BEIYU_COMPOSE_DATABASE_URL:?set BEIYU_COMPOSE_DATABASE_URL}
      BEIYU_SECRET_KEY: ${BEIYU_SECRET_KEY:?set BEIYU_SECRET_KEY}
      BEIYU_SMS_PROVIDER: ${BEIYU_SMS_PROVIDER:?set BEIYU_SMS_PROVIDER}
      BEIYU_SMS_DEVELOPMENT_CODE: ${BEIYU_SMS_DEVELOPMENT_CODE:-123456}
      BEIYU_AI_ENABLED: ${BEIYU_AI_ENABLED:?set BEIYU_AI_ENABLED}
      BEIYU_AI_PROVIDER: ${BEIYU_AI_PROVIDER:?set BEIYU_AI_PROVIDER}
      BEIYU_AI_MODEL: ${BEIYU_AI_MODEL:?set BEIYU_AI_MODEL}
      BEIYU_AI_DAILY_LIMIT: ${BEIYU_AI_DAILY_LIMIT:-50}
      BEIYU_AI_REQUESTS_PER_MINUTE: ${BEIYU_AI_REQUESTS_PER_MINUTE:-10}
      BEIYU_AI_TIMEOUT_SECONDS: ${BEIYU_AI_TIMEOUT_SECONDS:-20}
      BEIYU_AI_RESERVATION_SECONDS: ${BEIYU_AI_RESERVATION_SECONDS:-120}
      BEIYU_AI_CONTEXT_MESSAGES: ${BEIYU_AI_CONTEXT_MESSAGES:-20}
      BEIYU_AI_MEMORY_LIMIT: ${BEIYU_AI_MEMORY_LIMIT:-20}
      BEIYU_AI_BASE_URL: ${BEIYU_AI_BASE_URL:-}
      BEIYU_AI_API_KEY: ${BEIYU_AI_API_KEY:-}
      BEIYU_AI_MEMORY_HMAC_KEY: ${BEIYU_AI_MEMORY_HMAC_KEY:?set BEIYU_AI_MEMORY_HMAC_KEY}
      BEIYU_MEDIA_PROVIDER: ${BEIYU_MEDIA_PROVIDER:-local}
      BEIYU_MEDIA_UPLOAD_MAX_BYTES: ${BEIYU_MEDIA_UPLOAD_MAX_BYTES:-5242880}
      BEIYU_MEDIA_PUBLIC_BASE_URL: ${BEIYU_MEDIA_PUBLIC_BASE_URL:-}
      BEIYU_MEDIA_OSS_BUCKET: ${BEIYU_MEDIA_OSS_BUCKET:-}
      BEIYU_MEDIA_OSS_ENDPOINT: ${BEIYU_MEDIA_OSS_ENDPOINT:-}
      BEIYU_MEDIA_OSS_ACCESS_KEY_ID: ${BEIYU_MEDIA_OSS_ACCESS_KEY_ID:-}
      BEIYU_MEDIA_OSS_ACCESS_KEY_SECRET: ${BEIYU_MEDIA_OSS_ACCESS_KEY_SECRET:-}
      BEIYU_CORS_ALLOWED_ORIGINS: ${BEIYU_CORS_ALLOWED_ORIGINS:-}
      BEIYU_TRUSTED_PROXY_HOSTS: ${BEIYU_TRUSTED_PROXY_HOSTS:-127.0.0.1}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    profiles: ["migration"]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      BEIYU_ENVIRONMENT: ${BEIYU_ENVIRONMENT:?set BEIYU_ENVIRONMENT}
      BEIYU_DATABASE_URL: ${BEIYU_COMPOSE_DATABASE_URL:?set BEIYU_COMPOSE_DATABASE_URL}
      BEIYU_SECRET_KEY: ${BEIYU_SECRET_KEY:?set BEIYU_SECRET_KEY}
      BEIYU_SMS_PROVIDER: ${BEIYU_SMS_PROVIDER:?set BEIYU_SMS_PROVIDER}
      BEIYU_AI_ENABLED: ${BEIYU_AI_ENABLED:?set BEIYU_AI_ENABLED}
      BEIYU_AI_PROVIDER: ${BEIYU_AI_PROVIDER:?set BEIYU_AI_PROVIDER}
      BEIYU_AI_MODEL: ${BEIYU_AI_MODEL:?set BEIYU_AI_MODEL}
      BEIYU_AI_BASE_URL: ${BEIYU_AI_BASE_URL:-}
      BEIYU_AI_API_KEY: ${BEIYU_AI_API_KEY:-}
      BEIYU_AI_MEMORY_HMAC_KEY: ${BEIYU_AI_MEMORY_HMAC_KEY:?set BEIYU_AI_MEMORY_HMAC_KEY}
      BEIYU_MEDIA_PROVIDER: ${BEIYU_MEDIA_PROVIDER:-local}
      BEIYU_MEDIA_UPLOAD_MAX_BYTES: ${BEIYU_MEDIA_UPLOAD_MAX_BYTES:-5242880}
      BEIYU_MEDIA_PUBLIC_BASE_URL: ${BEIYU_MEDIA_PUBLIC_BASE_URL:-}
      BEIYU_MEDIA_OSS_BUCKET: ${BEIYU_MEDIA_OSS_BUCKET:-}
      BEIYU_MEDIA_OSS_ENDPOINT: ${BEIYU_MEDIA_OSS_ENDPOINT:-}
      BEIYU_MEDIA_OSS_ACCESS_KEY_ID: ${BEIYU_MEDIA_OSS_ACCESS_KEY_ID:-}
      BEIYU_MEDIA_OSS_ACCESS_KEY_SECRET: ${BEIYU_MEDIA_OSS_ACCESS_KEY_SECRET:-}
      BEIYU_TRUSTED_PROXY_HOSTS: ${BEIYU_TRUSTED_PROXY_HOSTS:-127.0.0.1}
    depends_on:
      db:
        condition: service_healthy

volumes:
  beiyu-postgres-data:
