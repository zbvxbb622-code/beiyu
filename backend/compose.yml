services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${BEIYU_COMPOSE_POSTGRES_DB:-beiyu}
      POSTGRES_USER: ${BEIYU_COMPOSE_POSTGRES_USER:-beiyu}
      POSTGRES_PASSWORD: ${BEIYU_COMPOSE_POSTGRES_PASSWORD:-beiyu}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - beiyu-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  db-test:
    image: postgres:16
    environment:
      POSTGRES_DB: beiyu_test
      POSTGRES_USER: ${BEIYU_COMPOSE_TEST_POSTGRES_USER:-beiyu}
      POSTGRES_PASSWORD: ${BEIYU_COMPOSE_TEST_POSTGRES_PASSWORD:-beiyu}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - beiyu-test-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      BEIYU_ENVIRONMENT: ${BEIYU_ENVIRONMENT:-dev}
      BEIYU_DATABASE_URL: ${BEIYU_COMPOSE_DATABASE_URL:-postgresql+psycopg://beiyu:beiyu@db:5432/beiyu}
      BEIYU_SECRET_KEY: ${BEIYU_SECRET_KEY:-change-me}
      BEIYU_AI_ENABLED: ${BEIYU_AI_ENABLED:-true}
      BEIYU_AI_PROVIDER: ${BEIYU_AI_PROVIDER:-development}
      BEIYU_AI_MODEL: ${BEIYU_AI_MODEL:-beiyu-development-v1}
      BEIYU_AI_DAILY_LIMIT: ${BEIYU_AI_DAILY_LIMIT:-50}
      BEIYU_AI_REQUESTS_PER_MINUTE: ${BEIYU_AI_REQUESTS_PER_MINUTE:-10}
      BEIYU_AI_TIMEOUT_SECONDS: ${BEIYU_AI_TIMEOUT_SECONDS:-20}
      BEIYU_AI_RESERVATION_SECONDS: ${BEIYU_AI_RESERVATION_SECONDS:-120}
      BEIYU_AI_CONTEXT_MESSAGES: ${BEIYU_AI_CONTEXT_MESSAGES:-20}
      BEIYU_AI_MEMORY_LIMIT: ${BEIYU_AI_MEMORY_LIMIT:-20}
      BEIYU_AI_BASE_URL: ${BEIYU_AI_BASE_URL:-}
      BEIYU_AI_API_KEY: ${BEIYU_AI_API_KEY:-}
      BEIYU_AI_MEMORY_HMAC_KEY: ${BEIYU_AI_MEMORY_HMAC_KEY:-beiyu-development-memory-hmac-key}
      BEIYU_MEDIA_PROVIDER: ${BEIYU_MEDIA_PROVIDER:-local}
      BEIYU_MEDIA_UPLOAD_MAX_BYTES: ${BEIYU_MEDIA_UPLOAD_MAX_BYTES:-5242880}
      BEIYU_MEDIA_PUBLIC_BASE_URL: ${BEIYU_MEDIA_PUBLIC_BASE_URL:-}
      BEIYU_MEDIA_OSS_BUCKET: ${BEIYU_MEDIA_OSS_BUCKET:-}
      BEIYU_MEDIA_OSS_ENDPOINT: ${BEIYU_MEDIA_OSS_ENDPOINT:-}
      BEIYU_MEDIA_OSS_ACCESS_KEY_ID: ${BEIYU_MEDIA_OSS_ACCESS_KEY_ID:-}
      BEIYU_MEDIA_OSS_ACCESS_KEY_SECRET: ${BEIYU_MEDIA_OSS_ACCESS_KEY_SECRET:-}
      BEIYU_CORS_ALLOWED_ORIGINS: ${BEIYU_CORS_ALLOWED_ORIGINS:-}
      BEIYU_TRUSTED_PROXY_HOSTS: ${BEIYU_TRUSTED_PROXY_HOSTS:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["migration"]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      BEIYU_ENVIRONMENT: ${BEIYU_ENVIRONMENT:-dev}
      BEIYU_DATABASE_URL: ${BEIYU_COMPOSE_DATABASE_URL:-postgresql+psycopg://beiyu:beiyu@db:5432/beiyu}
      BEIYU_SECRET_KEY: ${BEIYU_SECRET_KEY:-change-me}
      BEIYU_AI_ENABLED: ${BEIYU_AI_ENABLED:-true}
      BEIYU_AI_PROVIDER: ${BEIYU_AI_PROVIDER:-development}
      BEIYU_AI_MODEL: ${BEIYU_AI_MODEL:-beiyu-development-v1}
      BEIYU_AI_MEMORY_HMAC_KEY: ${BEIYU_AI_MEMORY_HMAC_KEY:-beiyu-development-memory-hmac-key}
      BEIYU_MEDIA_PROVIDER: ${BEIYU_MEDIA_PROVIDER:-local}
      BEIYU_MEDIA_UPLOAD_MAX_BYTES: ${BEIYU_MEDIA_UPLOAD_MAX_BYTES:-5242880}
      BEIYU_MEDIA_PUBLIC_BASE_URL: ${BEIYU_MEDIA_PUBLIC_BASE_URL:-}
      BEIYU_MEDIA_OSS_BUCKET: ${BEIYU_MEDIA_OSS_BUCKET:-}
      BEIYU_MEDIA_OSS_ENDPOINT: ${BEIYU_MEDIA_OSS_ENDPOINT:-}
      BEIYU_MEDIA_OSS_ACCESS_KEY_ID: ${BEIYU_MEDIA_OSS_ACCESS_KEY_ID:-}
      BEIYU_MEDIA_OSS_ACCESS_KEY_SECRET: ${BEIYU_MEDIA_OSS_ACCESS_KEY_SECRET:-}
    depends_on:
      db:
        condition: service_healthy

volumes:
  beiyu-postgres-data:
  beiyu-test-postgres-data:
