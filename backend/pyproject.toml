[project]
name = "beiyu-api"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
    "alembic>=1.12.1,<2.0.0",
    "fastapi[standard]>=0.139.0,<0.140.0",
    "httpx>=0.25.1,<1.0.0",
    "psycopg[binary]>=3.1.13,<4.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "sqlmodel>=0.0.39,<1.0.0",
]

[dependency-groups]
dev = [
    "coverage>=7.4.3,<8.0.0",
    "pytest>=7.4.3,<10.0.0",
    "ruff>=0.2.2,<1.0.0",
    "ty>=0.0.25",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP", "ARG001", "T201"]
ignore = ["E501", "B008", "B904"]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated; install `httpx2` instead.:starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["app"]

[tool.coverage.report]
show_missing = true
sort = "-Cover"

[tool.ty.terminal]
error-on-warning = true
